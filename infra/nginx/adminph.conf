# Nginx reverse proxy para AdminPH (producción).
# Coloca este archivo en /etc/nginx/conf.d/default.conf (o usa el volumen del
# docker-compose.prod.yml). Ajusta server_name y las rutas de certificados.

# Rate limit básico a nivel de edge (defensa adicional al ThrottlerGuard).
limit_req_zone $binary_remote_addr zone=adminph_api:10m rate=20r/s;

upstream adminph_backend {
  server backend:3000;
  keepalive 32;
}

# HTTP -> HTTPS
server {
  listen 80;
  server_name api.adminph.example;

  # Let's Encrypt challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.adminph.example;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Headers de seguridad (complementan Helmet del backend).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 10m; # comprobantes de pago (Fase 5.2)
  gzip on;
  gzip_types application/json text/plain application/javascript text/css;

  # Health checks sin rate limit (probes/uptime monitors).
  location ~ ^/(health|ready|live)$ {
    proxy_pass http://adminph_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  location / {
    limit_req zone=adminph_api burst=40 nodelay;

    proxy_pass http://adminph_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}

# Stack de PRODUCCIÓN (VPS Contabo). El backend corre dockerizado.
# Secrets vía archivo .env.production (NO commiteado) o gestor de secretos.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Migraciones: correr `prisma migrate deploy` en el paso de deploy ANTES de
# levantar la nueva imagen (ver infra/deploy o .github/workflows/deploy.yml).
services:
  postgres:
    image: postgres:16
    container_name: adminph_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - adminph_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adminph

  backend:
    image: ${BACKEND_IMAGE:-adminph-backend:latest}
    build:
      context: ./backend
    container_name: adminph_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
    expose:
      - "3000"
    networks:
      - adminph

  nginx:
    image: nginx:1.27-alpine
    container_name: adminph_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/adminph.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - adminph

volumes:
  adminph_pg_prod:

networks:
  adminph:
    driver: bridge

<aside class="flex h-full w-64 flex-col border-r border-slate-200 bg-white">
  <!-- Brand -->
  <div class="flex h-16 items-center gap-2 border-b border-slate-200 px-6">
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-blue-800 text-white">
      <i class="pi pi-building text-sm"></i>
    </span>
    <span class="text-lg font-semibold tracking-tight text-slate-900">AdminPH</span>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto px-3 py-4">
    @for (section of sections(); track section.title || $index) {
      <div class="mb-5">
        @if (section.title) {
          <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
            {{ section.title }}
          </p>
        }
        <ul class="space-y-1">
          @for (item of section.items; track item.route) {
            <li>
              <a
                [routerLink]="item.route"
                routerLinkActive="bg-blue-50 text-blue-800 font-medium"
                [routerLinkActiveOptions]="{ exact: false }"
                (click)="navigate.emit()"
                class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
              >
                <i [class]="item.icon + ' text-base'"></i>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>

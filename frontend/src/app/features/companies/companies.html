<app-page-header title="Empresas" subtitle="Gestión de empresas administradoras.">
  <p-button label="Nueva empresa" icon="pi pi-plus" (onClick)="openCreate()" />
</app-page-header>

<div class="rounded-xl border border-gray-200 bg-white shadow-sm">
  <p-table
    [value]="companies()"
    [lazy]="true"
    (onLazyLoad)="loadLazy($event)"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="total()"
    [loading]="loading()"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first}–{last} de {totalRecords}"
    dataKey="id"
    size="small"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
        <th>NIT</th>
        <th>Estado</th>
        <th pSortableColumn="createdAt">Creada <p-sortIcon field="createdAt" /></th>
        <th class="w-32 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-company>
      <tr>
        <td class="font-medium text-gray-900">{{ company.name }}</td>
        <td class="text-gray-600">{{ company.nit || "—" }}</td>
        <td><app-status-badge [status]="company.status" /></td>
        <td class="text-gray-600">{{ company.createdAt | date: "mediumDate" }}</td>
        <td class="text-right">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            ariaLabel="Editar"
            (onClick)="openEdit(company)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            ariaLabel="Eliminar"
            (onClick)="confirmDelete(company)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <app-empty-state
            icon="pi pi-building"
            title="Sin empresas"
            message="Aún no hay empresas registradas. Crea la primera con el botón “Nueva empresa”."
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Diálogo de alta / edición -->
<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '28rem' }"
  [header]="editing() ? 'Editar empresa' : 'Nueva empresa'"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-5 pt-2">
    <div>
      <label for="name" class="mb-1.5 block text-sm font-medium text-gray-700">Nombre</label>
      <input
        pInputText
        id="name"
        formControlName="name"
        placeholder="Constructora Acme S.A.S."
        class="w-full"
        [fluid]="true"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="mt-1 block text-red-600">El nombre es obligatorio (máx. 120).</small>
      }
    </div>

    <div>
      <label for="nit" class="mb-1.5 block text-sm font-medium text-gray-700">
        NIT <span class="text-gray-400">(opcional)</span>
      </label>
      <input
        pInputText
        id="nit"
        formControlName="nit"
        placeholder="900123456-7"
        class="w-full"
        [fluid]="true"
      />
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        [text]="true"
        (onClick)="dialogVisible.set(false)"
      />
      <p-button type="submit" label="Guardar" [loading]="saving()" />
    </div>
  </form>
</p-dialog>

<p-confirmDialog />

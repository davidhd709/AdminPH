<app-page-header title="Dashboard" [subtitle]="'Bienvenido, ' + userName()" />

<!-- KPIs -->
@if (stats().length) {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <app-kpi-card [label]="stat.label" [value]="stat.value" [icon]="stat.icon" [tone]="stat.tone" />
    }
  </div>
}

<!-- Gráfico: PQR por estado -->
@if (showPqrChart()) {
  <div class="mt-6">
    <app-section-card title="PQR por estado" subtitle="Solicitudes según su estado actual">
      @if (chart(); as c) {
        <apx-chart
          [series]="c.series"
          [chart]="c.chart"
          [xaxis]="c.xaxis"
          [yaxis]="c.yaxis"
          [dataLabels]="c.dataLabels"
          [plotOptions]="c.plotOptions"
          [fill]="c.fill"
          [colors]="c.colors"
        />
      } @else {
        <p class="py-12 text-center text-sm text-slate-400">Cargando datos…</p>
      }
    </app-section-card>
  </div>
}

@if (!stats().length && !showPqrChart()) {
  <app-section-card>
    <div class="py-8 text-center">
      <i class="pi pi-home mb-3 text-3xl text-slate-300"></i>
      <p class="text-sm text-slate-500">Bienvenido a AdminPH.</p>
    </div>
  </app-section-card>
}

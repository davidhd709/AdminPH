<div class="p-6 lg:p-8">
  <app-page-header title="Dashboard" [subtitle]="'Bienvenido, ' + userName()" />

  <!-- Stat cards -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (stat of stats(); track stat.label) {
      <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-gray-500">{{ stat.label }}</p>
          <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
            <i [class]="stat.icon"></i>
          </span>
        </div>
        <p class="mt-3 text-3xl font-semibold tracking-tight text-gray-900">{{ stat.value }}</p>
      </div>
    }
  </div>

  <!-- Chart card -->
  <div class="mt-6 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
    <div class="mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-base font-semibold text-gray-900">Recaudo por mes</h2>
        <p class="text-sm text-gray-500">Últimos 6 meses</p>
      </div>
    </div>

    <apx-chart
      [series]="chart().series"
      [chart]="chart().chart"
      [xaxis]="chart().xaxis"
      [yaxis]="chart().yaxis"
      [dataLabels]="chart().dataLabels"
      [stroke]="chart().stroke"
      [fill]="chart().fill"
      [grid]="chart().grid"
      [tooltip]="chart().tooltip"
      [colors]="chart().colors"
    />

    <p class="mt-4 text-xs text-gray-400">Datos de ejemplo — se conectarán en la Fase 2.</p>
  </div>
</div>

<app-page-header
  title="Torres"
  subtitle="Torres o bloques de cada copropiedad."
  [breadcrumbs]="[{ label: 'Administración' }, { label: 'Torres' }]"
>
  <p-button
    label="Nueva torre"
    icon="pi pi-plus"
    [disabled]="!selectedPropertyId()"
    (onClick)="openCreate()"
  />
</app-page-header>

<!-- Selector de copropiedad -->
<app-action-toolbar>
  <div class="w-full sm:w-72">
    <label class="mb-1.5 block text-sm font-medium text-slate-700">Copropiedad</label>
    <p-select
      [options]="properties()"
      optionLabel="name"
      optionValue="id"
      [ngModel]="selectedPropertyId()"
      (onChange)="onPropertyChange($event.value)"
      placeholder="Selecciona una copropiedad"
      [filter]="true"
      filterBy="name"
      styleClass="w-full"
      [fluid]="true"
    />
  </div>
</app-action-toolbar>

<app-section-card [bodyPadding]="false">
  <p-table
    [value]="towers()"
    [lazy]="true"
    (onLazyLoad)="loadLazy($event)"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="total()"
    [loading]="loading()"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first}–{last} de {totalRecords}"
    dataKey="id"
    size="small"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
        <th>Descripción</th>
        <th pSortableColumn="createdAt">Creada <p-sortIcon field="createdAt" /></th>
        <th class="w-32 text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-tower>
      <tr>
        <td class="font-medium text-slate-900">{{ tower.name }}</td>
        <td class="text-slate-600">{{ tower.description || "—" }}</td>
        <td class="text-slate-600">{{ tower.createdAt | date: "mediumDate" }}</td>
        <td class="text-right">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            ariaLabel="Editar"
            (onClick)="openEdit(tower)"
          />
          @if (canDelete()) {
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              ariaLabel="Eliminar"
              (onClick)="confirmDelete(tower)"
            />
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">
          <app-empty-state
            icon="pi pi-th-large"
            [title]="selectedPropertyId() ? 'Sin torres' : 'Selecciona una copropiedad'"
            [message]="
              selectedPropertyId()
                ? 'Esta copropiedad aún no tiene torres. Crea la primera con “Nueva torre”.'
                : 'Elige una copropiedad arriba para ver sus torres.'
            "
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</app-section-card>

<!-- Diálogo de alta / edición -->
<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '30rem' }"
  [header]="editing() ? 'Editar torre' : 'Nueva torre'"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-5 pt-2">
    <div>
      <label for="name" class="mb-1.5 block text-sm font-medium text-slate-700">Nombre</label>
      <input pInputText id="name" formControlName="name" placeholder="Torre A" class="w-full" [fluid]="true" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="mt-1 block text-red-600">El nombre es obligatorio (máx. 120).</small>
      }
    </div>

    <div>
      <label for="description" class="mb-1.5 block text-sm font-medium text-slate-700">
        Descripción <span class="text-slate-400">(opcional)</span>
      </label>
      <textarea
        pTextarea
        id="description"
        formControlName="description"
        rows="3"
        placeholder="Torre norte, 10 pisos"
        class="w-full"
        [fluid]="true"
      ></textarea>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <p-button type="button" label="Cancelar" severity="secondary" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button type="submit" label="Guardar" [loading]="saving()" />
    </div>
  </form>
</p-dialog>

<p-confirmDialog />

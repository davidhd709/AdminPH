<app-page-header
  title="Reportes"
  subtitle="Documentos descargables (PDF y Excel)."
  [breadcrumbs]="[{ label: 'Finanzas' }, { label: 'Reportes' }]"
/>

<!-- Selectores -->
<app-action-toolbar>
  <div class="w-full sm:w-72">
    <label class="mb-1.5 block text-sm font-medium text-slate-700">Copropiedad</label>
    <p-select
      [options]="properties()"
      optionLabel="name"
      optionValue="id"
      [ngModel]="selectedPropertyId()"
      (onChange)="onPropertyChange($event.value)"
      placeholder="Selecciona una copropiedad"
      [filter]="true"
      filterBy="name"
      styleClass="w-full"
      [fluid]="true"
    />
  </div>
  <div class="w-full sm:w-72">
    <label class="mb-1.5 block text-sm font-medium text-slate-700">Unidad</label>
    <p-select
      [options]="units()"
      optionLabel="code"
      optionValue="id"
      [ngModel]="selectedUnitId()"
      (onChange)="onUnitChange($event.value)"
      placeholder="Selecciona una unidad"
      [filter]="true"
      filterBy="code"
      [disabled]="!units().length"
      styleClass="w-full"
      [fluid]="true"
    />
  </div>
</app-action-toolbar>

@if (!selectedPropertyId()) {
  <app-section-card>
    <app-empty-state icon="pi pi-chart-bar" title="Selecciona una copropiedad" message="Elige una copropiedad (y una unidad) para descargar reportes." />
  </app-section-card>
} @else {
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
    <!-- Por unidad -->
    <app-section-card title="Por unidad" subtitle="Documentos PDF de la unidad seleccionada.">
      @if (!selectedUnitId()) {
        <p class="text-sm text-slate-400">Selecciona una unidad para habilitar estas descargas.</p>
      } @else {
        <div class="flex flex-col gap-2 sm:flex-row">
          <p-button
            label="Estado de cuenta"
            icon="pi pi-download"
            severity="secondary"
            [loading]="dlStatement()"
            (onClick)="downloadStatement()"
          />
          <p-button
            label="Paz y salvo"
            icon="pi pi-download"
            severity="secondary"
            [loading]="dlPazSalvo()"
            (onClick)="downloadPazSalvo()"
          />
        </div>
      }
    </app-section-card>

    <!-- Por copropiedad -->
    <app-section-card title="Por copropiedad" subtitle="Cartera (estado de cuotas de todas las unidades) en Excel.">
      <p-button
        label="Descargar cartera"
        icon="pi pi-download"
        [loading]="dlPortfolio()"
        (onClick)="downloadPortfolio()"
      />
    </app-section-card>
  </div>
}

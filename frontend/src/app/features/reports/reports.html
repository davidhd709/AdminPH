<app-page-header title="Reportes" subtitle="Documentos descargables (PDF y Excel)." />

<!-- Selectores -->
<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
  <div>
    <label class="mb-1.5 block text-sm font-medium text-gray-700">Copropiedad</label>
    <p-select
      [options]="properties()"
      optionLabel="name"
      optionValue="id"
      [ngModel]="selectedPropertyId()"
      (onChange)="onPropertyChange($event.value)"
      placeholder="Selecciona una copropiedad"
      [filter]="true"
      filterBy="name"
      styleClass="w-full"
      [fluid]="true"
    />
  </div>
  <div>
    <label class="mb-1.5 block text-sm font-medium text-gray-700">Unidad</label>
    <p-select
      [options]="units()"
      optionLabel="code"
      optionValue="id"
      [ngModel]="selectedUnitId()"
      (onChange)="onUnitChange($event.value)"
      placeholder="Selecciona una unidad"
      [filter]="true"
      filterBy="code"
      [disabled]="!units().length"
      styleClass="w-full"
      [fluid]="true"
    />
  </div>
</div>

@if (!selectedPropertyId()) {
  <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
    <app-empty-state icon="pi pi-chart-bar" title="Selecciona una copropiedad" message="Elige una copropiedad (y una unidad) para descargar reportes." />
  </div>
} @else {
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
    <!-- Por unidad -->
    <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
      <div class="mb-1 flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
          <i class="pi pi-file-pdf"></i>
        </span>
        <h2 class="text-sm font-semibold text-gray-900">Por unidad</h2>
      </div>
      <p class="mb-4 text-sm text-gray-500">
        Documentos PDF de la unidad seleccionada.
      </p>
      @if (!selectedUnitId()) {
        <p class="text-sm text-gray-400">Selecciona una unidad para habilitar estas descargas.</p>
      } @else {
        <div class="flex flex-col gap-2 sm:flex-row">
          <p-button
            label="Estado de cuenta"
            icon="pi pi-download"
            severity="secondary"
            [loading]="dlStatement()"
            (onClick)="downloadStatement()"
          />
          <p-button
            label="Paz y salvo"
            icon="pi pi-download"
            severity="secondary"
            [loading]="dlPazSalvo()"
            (onClick)="downloadPazSalvo()"
          />
        </div>
      }
    </div>

    <!-- Por copropiedad -->
    <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
      <div class="mb-1 flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-green-50 text-green-600">
          <i class="pi pi-file-excel"></i>
        </span>
        <h2 class="text-sm font-semibold text-gray-900">Por copropiedad</h2>
      </div>
      <p class="mb-4 text-sm text-gray-500">
        Cartera (estado de cuotas de todas las unidades) en Excel.
      </p>
      <p-button
        label="Descargar cartera"
        icon="pi pi-download"
        [loading]="dlPortfolio()"
        (onClick)="downloadPortfolio()"
      />
    </div>
  </div>
}

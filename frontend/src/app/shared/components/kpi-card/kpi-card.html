<div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm transition-shadow hover:shadow-md">
  <span class="mb-3 flex h-11 w-11 items-center justify-center rounded-lg" [class]="toneClasses()">
    <i [class]="icon()" class="text-lg"></i>
  </span>
  <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">{{ label() }}</p>
  <p
    class="mt-1 text-3xl font-semibold tracking-tight text-slate-900"
    [class.font-data]="mono()"
  >
    {{ displayValue() }}
  </p>
  @if (hint()) {
    <p class="mt-2 text-xs text-slate-500">{{ hint() }}</p>
  }
</div>

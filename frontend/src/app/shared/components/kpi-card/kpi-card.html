<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-center justify-between">
    <p class="text-sm font-medium text-slate-500">{{ label() }}</p>
    <span class="flex h-9 w-9 items-center justify-center rounded-lg" [class]="toneClasses()">
      <i [class]="icon()"></i>
    </span>
  </div>
  <p class="mt-3 text-3xl font-semibold tracking-tight text-slate-900">{{ displayValue() }}</p>
</div>
